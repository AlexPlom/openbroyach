name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Verify binary
        run: target/release/openbroyach --version
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/openbroyach dist/openbroyach
          cp README.md LICENSE.md dist/
          tar -C dist -czf openbroyach-linux-x86_64.tar.gz openbroyach README.md LICENSE.md
          sha256sum openbroyach-linux-x86_64.tar.gz > openbroyach-linux-x86_64.tar.gz.sha256
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            openbroyach-linux-x86_64.tar.gz
            openbroyach-linux-x86_64.tar.gz.sha256
